name: Semgrep SAST Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: python -m pip install semgrep

      - name: Ejecutar análisis de seguridad
        run: semgrep --config=auto --sarif --output=semgrep-results.sarif --exclude .github .

      - name: Mostrar resultados
        if: always()
        run: cat semgrep-results.sarif